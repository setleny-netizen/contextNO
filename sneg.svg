<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для скафандра -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="visorReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    
    <!-- Тени -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Стили для интерактивности (анимация при наведении) -->
  <style>
    .arm-left { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 170px 320px; }
    .arm-left:hover { transform: rotate(-30deg); }
    
    .arm-right { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 330px 320px; }
    .arm-right:hover { transform: rotate(30deg); }
    
    .helmet { transition: transform 0.4s ease; transform-origin: 250px 200px; }
    .helmet:hover { transform: translateY(-10px) rotate(5deg); }
    
    .leg-left { transition: transform 0.4s ease; transform-origin: 210px 450px; }
    .leg-left:hover { transform: rotate(15deg); }
    
    .leg-right { transition: transform 0.4s ease; transform-origin: 290px 450px; }
    .leg-right:hover { transform: rotate(-15deg); }
  </style>

  <!-- Фон (космос) -->
  <rect width="500" height="600" fill="#1e1b4b" rx="20" />
  
  <!-- Звезды -->
  <circle cx="80" cy="100" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="420" cy="80" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="150" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="120" cy="300" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="400" cy="400" r="2.5" fill="#fff" opacity="0.7"/>
  <circle cx="50" cy="500" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="450" cy="250" r="1.5" fill="#fff" opacity="0.8"/>

  <!-- Планета на фоне -->
  <circle cx="400" cy="100" r="40" fill="#f59e0b" opacity="0.8" />
  <ellipse cx="400" cy="100" rx="60" ry="10" fill="none" stroke="#fcd34d" stroke-width="4" transform="rotate(-20 400 100)" opacity="0.6" />

  <!-- Тень на полу -->
  <ellipse cx="250" cy="540" rx="100" ry="15" fill="#0f172a" opacity="0.4" />

  <!-- ================= ПЕРСОНАЖ ================= -->

  <!-- НОГИ -->
  <g id="legs">
    <!-- Левая нога -->
    <g class="leg-left">
      <rect x="185" y="420" width="50" height="90" rx="20" fill="url(#suitGrad)" filter="url(#shadow)" />
      <rect x="175" y="500" width="70" height="30" rx="10" fill="#475569" filter="url(#softShadow)" />
      <rect x="180" y="505" width="60" height="5" fill="#64748b" rx="2" />
    </g>
    <!-- Правая нога -->
    <g class="leg-right">
      <rect x="265" y="420" width="50" height="90" rx="20" fill="url(#suitGrad)" filter="url(#shadow)" />
      <rect x="255" y="500" width="70" height="30" rx="10" fill="#475569" filter="url(#softShadow)" />
      <rect x="260" y="505" width="60" height="5" fill="#64748b" rx="2" />
    </g>
  </g>

  <!-- ТЕЛО (Рюкзак и скафандр) -->
  <g id="body" filter="url(#shadow)">
    <!-- Рюкзак за спиной -->
    <rect x="170" y="280" width="160" height="180" rx="30" fill="#94a3b8" />
    <rect x="180" y="290" width="140" height="160" rx="20" fill="#64748b" />
    <circle cx="250" cy="370" r="15" fill="#38bdf8" opacity="0.8" />
    <circle cx="250" cy="370" r="8" fill="#0284c7" />
    
    <!-- Основной корпус -->
    <rect x="160" y="280" width="180" height="180" rx="40" fill="url(#suitGrad)" />
    
    <!-- Грудная панель -->
    <rect x="200" y="310" width="100" height="60" rx="10" fill="#e2e8f0" />
    <rect x="210" y="320" width="80" height="40" rx="5" fill="#f8fafc" />
    
    <!-- Индикаторы на груди -->
    <circle cx="220" cy="340" r="6" fill="#ef4444" />
    <circle cx="240" cy="340" r="6" fill="#22c55e" />
    <circle cx="260" cy="340" r="6" fill="#3b82f6" />
    <rect x="215" y="355" width="70" height="4" fill="#cbd5e1" rx="2" />

    <!-- Пояс -->
    <rect x="155" y="420" width="190" height="25" rx="10" fill="#475569" />
    <rect x="235" y="415" width="30" height="35" rx="5" fill="#fbbf24" />
  </g>

  <!-- РУКИ -->
  <g id="arms" filter="url(#shadow)">
    <!-- Левая рука (машет) -->
    <g class="arm-left">
      <path d="M 170 320 Q 100 320 100 240" fill="none" stroke="url(#suitGrad)" stroke-width="40" stroke-linecap="round" />
      <circle cx="100" cy="240" r="25" fill="#94a3b8" />
      <!-- Перчатка -->
      <circle cx="100" cy="240" r="15" fill="#f8fafc" />
    </g>

    <!-- Правая рука (опущена) -->
    <g class="arm-right">
      <path d="M 330 320 Q 400 320 400 380" fill="none" stroke="url(#suitGrad)" stroke-width="40" stroke-linecap="round" />
      <circle cx="400" cy="380" r="25" fill="#94a3b8" />
      <!-- Перчатка -->
      <circle cx="400" cy="380" r="15" fill="#f8fafc" />
    </g>
  </g>

  <!-- ШЛЕМ -->
  <g id="helmet-group" class="helmet" filter="url(#shadow)">
    <!-- Воротник -->
    <rect x="190" y="250" width="120" height="30" rx="15" fill="#475569" />
    
    <!-- Купол шлема -->
    <circle cx="250" cy="190" r="85" fill="url(#suitGrad)" />
    
    <!-- Забрало (Стекло) -->
    <ellipse cx="250" cy="190" rx="65" ry="55" fill="url(#visorGrad)" />
    
    <!-- Блик на стекле (отражение космоса) -->
    <path d="M 200 160 Q 240 130 280 160 Q 250 200 200 160 Z" fill="url(#visorReflect)" />
    <circle cx="210" cy="170" r="5" fill="#fff" opacity="0.6" />
    
    <!-- Антенна -->
    <line x1="250" y1="105" x2="250" y2="70" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <circle cx="250" cy="70" r="8" fill="#ef4444" />
    <circle cx="250" cy="70" r="4" fill="#fca5a5" />
  </g>

  <!-- Мини-подсказка для пользователя -->
  <text x="250" y="580" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle" opacity="0.8">Наведите на руки, ноги или шлем</text>
</svg>
