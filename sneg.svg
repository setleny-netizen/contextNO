<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для объема -->
    <radialGradient id="snowGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e5ec" />
      <stop offset="100%" stop-color="#b0b8c4" />
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <!-- Эффект свечения для нимба -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон (ночное небо) -->
  <rect width="400" height="500" fill="#111827" />

  <!-- Снежный горизонт -->
  <path d="M 0 350 Q 100 320 200 340 T 400 350 L 400 500 L 0 500 Z" fill="#e5e7eb" />
  
  <!-- Красный плащ (сзади) -->
  <path d="M 180 220 Q 120 280 130 360 L 270 360 Q 280 280 220 220 Z" fill="url(#capeGrad)" />

  <!-- Тело снеговика (нижний и средний ком) -->
  <circle cx="200" cy="340" r="55" fill="url(#snowGrad)" />
  <circle cx="200" cy="260" r="45" fill="url(#snowGrad)" />

  <!-- Пуговицы -->
  <circle cx="200" cy="250" r="4" fill="#333" />
  <circle cx="200" cy="270" r="4" fill="#333" />
  <circle cx="200" cy="330" r="5" fill="#333" />
  <circle cx="200" cy="355" r="5" fill="#333" />

  <!-- Голова -->
  <circle cx="200" cy="180" r="35" fill="url(#snowGrad)" />

  <!-- Лицо (Морковка и глаза) -->
  <polygon points="200,180 230,185 200,190" fill="#f97316" />
  <circle cx="185" cy="170" r="3" fill="#333" />
  <circle cx="215" cy="170" r="3" fill="#333" />
  <!-- Рот (пуговицы) -->
  <circle cx="190" cy="195" r="2.5" fill="#333" />
  <circle cx="200" cy="198" r="2.5" fill="#333" />
  <circle cx="210" cy="195" r="2.5" fill="#333" />

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 1: ШЛЕМ И НИМБ -->
  <g id="helmet-group">
    <!-- Золотой нимб -->
    <ellipse cx="200" cy="150" rx="45" ry="12" fill="none" stroke="#fbbf24" stroke-width="3" filter="url(#glow)" />
    <!-- Сам шлем -->
    <path d="M 165 160 Q 165 120 200 120 Q 235 120 235 160 Z" fill="url(#metalGrad)" />
    <!-- Козырек -->
    <path d="M 160 160 Q 200 175 240 160 L 235 165 Q 200 180 165 165 Z" fill="#4b5563" />
    <!-- Красный плюмаж (перо) -->
    <path d="M 200 120 Q 220 80 240 90 Q 230 100 215 120 Z" fill="#dc2626" />
    <path d="M 200 120 Q 210 95 220 100" fill="none" stroke="#991b1b" stroke-width="2" />
  </g>

  <!-- Пояс -->
  <rect x="165" y="230" width="70" height="12" fill="#78350f" rx="4" />
  <rect x="190" y="228" width="20" height="16" fill="#fbbf24" rx="2" />
  <rect x="195" y="232" width="10" height="8" fill="#78350f" rx="1" />

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 2: ЩИТ -->
  <g id="shield-group">
    <path d="M 110 220 L 160 210 L 160 280 Q 135 310 110 280 Z" fill="url(#shieldGrad)" stroke="#9ca3af" stroke-width="4" />
    <!-- Крест на щите -->
    <path d="M 135 215 L 135 295 M 115 245 L 155 245" stroke="#fbbf24" stroke-width="8" />
    <!-- Заклепки -->
    <circle cx="118" cy="230" r="2" fill="#fbbf24" />
    <circle cx="152" cy="225" r="2" fill="#fbbf24" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 3: МЕЧ -->
  <g id="sword-group">
    <!-- Рука (веточка) -->
    <path d="M 230 240 Q 250 240 260 220" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
    <!-- Рукоять -->
    <rect x="255" y="205" width="6" height="20" fill="#78350f" transform="rotate(30 258 215)" />
    <!-- Гарда -->
    <rect x="245" y="195" width="25" height="6" fill="#fbbf24" transform="rotate(30 258 198)" />
    <!-- Лезвие -->
    <polygon points="265,200 270,140 275,200" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" />
  </g>
</svg>
