<svg width="500" height="600" viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Неоновые градиенты -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    
    <!-- Градиент для шерсти -->
    <linearGradient id="furDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35" />
      <stop offset="100%" stop-color="#111118" />
    </linearGradient>
    <linearGradient id="furLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d3d4a" />
      <stop offset="100%" stop-color="#1a1a24" />
    </linearGradient>

    <!-- Свечение -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Тени -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Анимации при наведении -->
  <style>
    .tail { transition: transform 0.5s ease-in-out; transform-origin: 200px 420px; }
    .tail:hover { transform: rotate(-20deg); }
    
    .ear-left { transition: transform 0.3s ease; transform-origin: 170px 180px; }
    .ear-left:hover { transform: rotate(-15deg); }
    
    .ear-right { transition: transform 0.3s ease; transform-origin: 330px 180px; }
    .ear-right:hover { transform: rotate(15deg); }
    
    .cyber-eye { transition: opacity 0.3s ease; }
    .cyber-eye:hover { opacity: 0.5; }
    
    .hud { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>

  <!-- Фон (Ночной город) -->
  <rect width="500" height="600" fill="#0b0c10" rx="20" />
  
  <!-- Сетка на фоне -->
  <path d="M 0 100 L 500 100 M 0 200 L 500 200 M 0 300 L 500 300 M 0 400 L 500 400 M 0 500 L 500 500" stroke="#1f2833" stroke-width="1" opacity="0.5" />
  <path d="M 100 0 L 100 600 M 200 0 L 200 600 M 300 0 L 300 600 M 400 0 L 400 600" stroke="#1f2833" stroke-width="1" opacity="0.5" />

  <!-- Неоновые вывески на фоне -->
  <rect x="30" y="250" width="20" height="150" fill="url(#neonPink)" filter="url(#glowPink)" opacity="0.4" />
  <rect x="450" y="150" width="15" height="200" fill="url(#neonCyan)" filter="url(#glowCyan)" opacity="0.4" />

  <!-- Тень на полу -->
  <ellipse cx="250" cy="520" rx="120" ry="20" fill="#000" opacity="0.6" filter="url(#dropShadow)" />

  <!-- ================= ПЕРСОНАЖ ================= -->

  <!-- ХВОСТ -->
  <g class="tail" filter="url(#dropShadow)">
    <path d="M 200 430 Q 80 450 80 350 Q 80 250 150 200" fill="none" stroke="url(#furDark)" stroke-width="60" stroke-linecap="round" />
    <!-- Неоновые полосы на хвосте -->
    <path d="M 180 430 Q 120 440 120 380" fill="none" stroke="url(#neonPink)" stroke-width="8" filter="url(#glowPink)" />
    <path d="M 100 330 Q 100 280 130 250" fill="none" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glowCyan)" />
    <!-- Кончик хвоста -->
    <circle cx="150" cy="200" r="25" fill="url(#neonPink)" filter="url(#glowPink)" opacity="0.8" />
  </g>

  <!-- ТЕЛО -->
  <g id="body" filter="url(#dropShadow)">
    <!-- Основа тела -->
    <path d="M 180 280 Q 250 260 320 280 L 330 480 Q 250 520 170 480 Z" fill="url(#furDark)" />
    
    <!-- Грудка (светлая шерсть) -->
    <path d="M 210 300 Q 250 280 290 300 L 280 450 Q 250 470 220 450 Z" fill="url(#furLight)" />
    
    <!-- Кибер-имплант на груди -->
    <rect x="230" y="330" width="40" height="20" rx="5" fill="#111" stroke="url(#neonCyan)" stroke-width="2" />
    <circle cx="240" cy="340" r="4" fill="#00ffff" filter="url(#glowCyan)" class="hud" />
    <circle cx="260" cy="340" r="4" fill="#ff007f" filter="url(#glowPink)" class="hud" />
    
    <!-- Лапы (передние) -->
    <rect x="200" y="480" width="40" height="50" rx="15" fill="url(#furDark)" />
    <rect x="260" y="480" width="40" height="50" rx="15" fill="url(#furDark)" />
    <!-- Когти (неон) -->
    <line x1="205" y1="525" x2="205" y2="535" stroke="#00ffff" stroke-width="3" filter="url(#glowCyan)" stroke-linecap="round" />
    <line x1="215" y1="525" x2="215" y2="535" stroke="#00ffff" stroke-width="3" filter="url(#glowCyan)" stroke-linecap="round" />
    <line x1="265" y1="525" x2="265" y2="535" stroke="#ff007f" stroke-width="3" filter="url(#glowPink)" stroke-linecap="round" />
    <line x1="275" y1="525" x2="275" y2="535" stroke="#ff007f" stroke-width="3" filter="url(#glowPink)" stroke-linecap="round" />
  </g>

  <!-- ГОЛОВА -->
  <g id="head" filter="url(#dropShadow)">
    <!-- Форма головы (геометричная) -->
    <polygon points="170,200 250,150 330,200 300,300 200,300" fill="url(#furDark)" />
    
    <!-- Морда (светлая) -->
    <polygon points="200,230 250,200 300,230 280,290 220,290" fill="url(#furLight)" />
    
    <!-- Уши -->
    <g class="ear-left">
      <polygon points="170,200 140,100 200,170" fill="url(#furDark)" />
      <polygon points="170,200 155,130 190,180" fill="url(#neonPink)" filter="url(#glowPink)" opacity="0.6" />
    </g>
    <g class="ear-right">
      <polygon points="330,200 360,100 300,170" fill="url(#furDark)" />
      <polygon points="330,200 345,130 310,180" fill="url(#neonPink)" filter="url(#glowPink)" opacity="0.6" />
    </g>

    <!-- Глаза (Кибер-импланты) -->
    <g class="cyber-eye">
      <!-- Левый глаз -->
      <polygon points="200,230 230,220 230,250 200,260" fill="#111" stroke="#00ffff" stroke-width="2" filter="url(#glowCyan)" />
      <circle cx="215" cy="240" r="4" fill="#fff" />
      <!-- Правый глаз (с прицелом) -->
      <polygon points="270,220 300,230 300,260 270,250" fill="#111" stroke="#ff007f" stroke-width="2" filter="url(#glowPink)" />
      <circle cx="285" cy="240" r="4" fill="#fff" />
      <!-- Лазерный прицел -->
      <line x1="285" y1="240" x2="380" y2="220" stroke="#ff007f" stroke-width="1" filter="url(#glowPink)" opacity="0.6" stroke-dasharray="4 2" />
    </g>

    <!-- Нос -->
    <polygon points="250,250 240,265 260,265" fill="#ff007f" filter="url(#glowPink)" />
    
    <!-- Кибер-визор (HUD) на лбу -->
    <rect x="220" y="195" width="60" height="10" rx="3" fill="#111" stroke="#00ffff" stroke-width="1" />
    <line x1="225" y1="200" x2="275" y2="200" stroke="#00ffff" stroke-width="2" filter="url(#glowCyan)" class="hud" />
  </g>

</svg>
