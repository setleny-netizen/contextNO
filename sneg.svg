<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для снега (объем) -->
    <radialGradient id="snowBody" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    
    <radialGradient id="snowHead" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Градиент для металлического шлема -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Градиент для щита (синий) -->
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Градиент для плаща -->
    <linearGradient id="capeRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Тень для объема -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    
    <!-- Свечение для нимба -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон (темное небо) -->
  <rect width="400" height="500" fill="#0a0a0a" />
  
  <!-- Звезды на фоне -->
  <circle cx="100" cy="150" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="300" cy="120" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="80" cy="250" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="330" cy="200" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="250" cy="100" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="80" r="1" fill="#fff" opacity="0.6"/>
  
  <!-- Блик (звездочка) слева от шлема -->
  <path d="M 140 180 L 145 190 L 155 195 L 145 200 L 140 210 L 135 200 L 125 195 L 135 190 Z" fill="#fff" opacity="0.9" />

  <!-- Снежная земля (вид сбоку, как на скрине) -->
  <rect x="0" y="400" width="400" height="100" fill="#e2e8f0" />
  <rect x="0" y="390" width="400" height="10" fill="#cbd5e1" />
  <path d="M 0 400 Q 50 380 100 400 T 200 400 T 300 400 T 400 400 L 400 390 L 0 390 Z" fill="#ffffff" />

  <!-- Плащ (сзади) -->
  <path d="M 190 230 Q 110 300 140 410 L 260 410 Q 290 300 210 230 Z" fill="url(#capeRed)" filter="url(#shadow)" />

  <!-- ТЕЛО (Снеговик) -->
  <g id="snowman-body" filter="url(#shadow)">
    <!-- Нижний ком -->
    <circle cx="200" cy="360" r="60" fill="url(#snowBody)" />
    <!-- Средний ком -->
    <circle cx="200" cy="260" r="50" fill="url(#snowBody)" />
    <!-- Верхний ком (шея/грудь) -->
    <circle cx="200" cy="190" r="40" fill="url(#snowBody)" />
    
    <!-- Тень под шлемом на верхнем коме -->
    <path d="M 160 190 Q 200 210 240 190 Q 200 200 160 190 Z" fill="#64748b" opacity="0.5" />

    <!-- Пуговицы -->
    <circle cx="200" cy="250" r="4.5" fill="#1e293b" />
    <circle cx="200" cy="275" r="4.5" fill="#1e293b" />
    <circle cx="200" cy="340" r="5" fill="#1e293b" />
    <circle cx="200" cy="370" r="5" fill="#1e293b" />
  </g>

  <!-- ПОЯС -->
  <g id="belt" filter="url(#shadow)">
    <rect x="150" y="220" width="100" height="14" fill="#451a03" rx="3" />
    <rect x="185" y="216" width="30" height="22" fill="#fbbf24" rx="2" />
    <rect x="195" y="221" width="10" height="12" fill="#78350f" rx="1" />
    <!-- Блик на поясе -->
    <rect x="155" y="222" width="85" height="2" fill="#78350f" opacity="0.6" />
  </g>

  <!-- ГОЛОВА -->
  <g id="head" filter="url(#shadow)">
    <circle cx="200" cy="160" r="35" fill="url(#snowHead)" />
    
    <!-- Морковка (нос) -->
    <polygon points="185,165 220,168 185,175" fill="#ea580c" />
    <polygon points="185,165 205,167 185,175" fill="#f97316" />
    
    <!-- Глаза -->
    <circle cx="188" cy="152" r="3.5" fill="#0f172a" />
    <circle cx="212" cy="152" r="3.5" fill="#0f172a" />
    <!-- Блик в глазах -->
    <circle cx="189" cy="151" r="1" fill="#fff" />
    <circle cx="213" cy="151" r="1" fill="#fff" />
    
    <!-- Рот (угольки) -->
    <circle cx="188" cy="175" r="2" fill="#0f172a" />
    <circle cx="196" cy="178" r="2" fill="#0f172a" />
    <circle cx="204" cy="178" r="2" fill="#0f172a" />
    <circle cx="212" cy="175" r="2" fill="#0f172a" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 1: ШЛЕМ И НИМБ -->
  <g id="helmet-group" filter="url(#shadow)">
    <!-- Золотой нимб (свечение) -->
    <ellipse cx="200" cy="130" rx="50" ry="10" fill="none" stroke="#fbbf24" stroke-width="4" filter="url(#glow)" />
    
    <!-- Задняя часть шлема (купол) -->
    <path d="M 155 145 Q 155 90 200 90 Q 245 90 245 145 Z" fill="url(#metal)" />
    
    <!-- Красный плюмаж (перо) -->
    <path d="M 195 95 Q 230 30 260 50 Q 240 70 215 100 Z" fill="#dc2626" />
    <path d="M 195 95 Q 220 45 245 60" fill="none" stroke="#991b1b" stroke-width="3" />
    
    <!-- Козырек (забрало) -->
    <path d="M 150 145 Q 200 165 250 145 L 245 155 Q 200 175 155 155 Z" fill="#64748b" />
    <!-- Блик на козырьке -->
    <path d="M 150 145 Q 200 165 250 145" fill="none" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Защитная сетка (решетка) на лице -->
    <path d="M 165 155 L 235 155" stroke="#475569" stroke-width="2" />
    <path d="M 170 160 L 230 160" stroke="#475569" stroke-width="2" />
    <path d="M 180 150 L 180 165 M 200 155 L 200 170 M 220 150 L 220 165" stroke="#475569" stroke-width="2" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 2: МЕЧ И РУКА -->
  <g id="sword-group" filter="url(#shadow)">
    <!-- Рука (веточка) -->
    <path d="M 230 250 Q 270 250 280 200" fill="none" stroke="#451a03" stroke-width="6" stroke-linecap="round" />
    
    <!-- Рукоять -->
    <rect x="276" y="180" width="8" height="25" fill="#78350f" transform="rotate(20 280 192)" />
    <!-- Гарда -->
    <rect x="265" y="170" width="30" height="8" fill="#fbbf24" transform="rotate(20 280 174)" rx="2" />
    <!-- Лезвие -->
    <polygon points="285,175 295,80 305,175" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <!-- Блик на лезвии -->
    <polygon points="290,175 295,80 305,175" fill="#cbd5e1" opacity="0.6" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 3: ЩИТ -->
  <g id="shield-group" filter="url(#shadow)">
    <!-- Основа щита -->
    <path d="M 100 210 L 155 195 L 155 280 Q 127 320 100 280 Z" fill="url(#shieldBlue)" stroke="#334155" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Крест -->
    <path d="M 127 200 L 127 305 M 105 245 L 150 245" stroke="#fbbf24" stroke-width="8" />
    <path d="M 127 200 L 127 305 M 105 245 L 150 245" stroke="#fef08a" stroke-width="3" />
    
    <!-- Заклепки -->
    <circle cx="112" cy="220" r="3" fill="#fbbf24" />
    <circle cx="143" cy="212" r="3" fill="#fbbf24" />
    <circle cx="112" cy="270" r="3" fill="#fbbf24" />
    <circle cx="143" cy="262" r="3" fill="#fbbf24" />
  </g>

</svg>
