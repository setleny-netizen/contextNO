<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты для снега (объем) -->
    <radialGradient id="snowGradHead" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <radialGradient id="snowGradBody" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>
    
    <!-- Градиент для шлема -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Градиент для щита -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Градиент для плаща -->
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Тень для снега -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.3" />
    </filter>
    
    <!-- Свечение для нимба -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Фон (темное небо) -->
  <rect width="400" height="500" fill="#0f172a" />
  
  <!-- Звезды на фоне -->
  <circle cx="80" cy="100" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="320" cy="80" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="50" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="280" cy="150" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="120" cy="200" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="340" cy="220" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="60" cy="300" r="1.5" fill="#fff" opacity="0.5"/>

  <!-- Снежная земля -->
  <path d="M 0 380 Q 100 350 200 370 T 400 380 L 400 500 L 0 500 Z" fill="#e2e8f0" />
  <path d="M 0 390 Q 150 370 250 390 T 400 400 L 400 500 L 0 500 Z" fill="#f8fafc" />

  <!-- Плащ (сзади) -->
  <path d="M 190 240 Q 120 300 140 380 L 260 380 Q 280 300 210 240 Z" fill="url(#capeGrad)" filter="url(#dropShadow)" />

  <!-- ТЕЛО (Снеговик) -->
  <g id="snowman-body" filter="url(#dropShadow)">
    <!-- Нижний ком -->
    <circle cx="200" cy="350" r="65" fill="url(#snowGradBody)" />
    <!-- Средний ком -->
    <circle cx="200" cy="250" r="50" fill="url(#snowGradBody)" />
    
    <!-- Тени между комами -->
    <ellipse cx="200" cy="295" rx="40" ry="10" fill="#64748b" opacity="0.4" />
    
    <!-- Пуговицы -->
    <circle cx="200" cy="240" r="4" fill="#1e293b" />
    <circle cx="200" cy="260" r="4" fill="#1e293b" />
    <circle cx="200" cy="330" r="5" fill="#1e293b" />
    <circle cx="200" cy="360" r="5" fill="#1e293b" />
  </g>

  <!-- ПОЯС -->
  <g id="belt" filter="url(#dropShadow)">
    <rect x="145" y="210" width="110" height="16" fill="#451a03" rx="4" />
    <rect x="185" y="207" width="30" height="22" fill="#fbbf24" rx="3" />
    <rect x="195" y="212" width="10" height="12" fill="#78350f" rx="2" />
    <!-- Блик на поясе -->
    <rect x="150" y="212" width="90" height="3" fill="#78350f" opacity="0.5" rx="1" />
  </g>

  <!-- ГОЛОВА -->
  <g id="head" filter="url(#dropShadow)">
    <circle cx="200" cy="170" r="45" fill="url(#snowGradHead)" />
    
    <!-- Морковка (нос) -->
    <polygon points="185,175 225,180 185,185" fill="#ea580c" />
    <polygon points="185,175 210,178 185,185" fill="#f97316" />
    
    <!-- Глаза -->
    <circle cx="185" cy="160" r="4" fill="#0f172a" />
    <circle cx="215" cy="160" r="4" fill="#0f172a" />
    
    <!-- Рот (угольки) -->
    <circle cx="185" cy="185" r="2.5" fill="#0f172a" />
    <circle cx="195" cy="190" r="2.5" fill="#0f172a" />
    <circle cx="205" cy="190" r="2.5" fill="#0f172a" />
    <circle cx="215" cy="185" r="2.5" fill="#0f172a" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 1: ШЛЕМ И НИМБ -->
  <g id="helmet-group" filter="url(#dropShadow)">
    <!-- Золотой нимб -->
    <ellipse cx="200" cy="135" rx="55" ry="12" fill="none" stroke="#fbbf24" stroke-width="5" filter="url(#glow)" />
    
    <!-- Задняя часть шлема -->
    <path d="M 155 155 Q 155 100 200 100 Q 245 100 245 155 Z" fill="url(#helmetGrad)" />
    
    <!-- Красный плюмаж (перо) -->
    <path d="M 200 105 Q 230 40 260 60 Q 250 80 215 110 Z" fill="#dc2626" />
    <path d="M 200 105 Q 220 50 240 70" fill="none" stroke="#991b1b" stroke-width="3" />
    
    <!-- Козырек -->
    <path d="M 150 155 Q 200 175 250 155 L 245 165 Q 200 185 155 165 Z" fill="#64748b" />
    <path d="M 150 155 Q 200 175 250 155" fill="none" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 2: МЕЧ И РУКА -->
  <g id="sword-group" filter="url(#dropShadow)">
    <!-- Рука (веточка) -->
    <path d="M 230 230 Q 260 230 270 190" fill="none" stroke="#451a03" stroke-width="6" stroke-linecap="round" />
    
    <!-- Рукоять -->
    <rect x="265" y="170" width="8" height="25" fill="#78350f" transform="rotate(20 269 182)" />
    <!-- Гарда -->
    <rect x="255" y="160" width="28" height="8" fill="#fbbf24" transform="rotate(20 269 164)" rx="2" />
    <!-- Лезвие -->
    <polygon points="275,165 285,80 295,165" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <polygon points="280,165 285,80 295,165" fill="#cbd5e1" opacity="0.5" />
  </g>

  <!-- 🔥 ПОДВИЖНАЯ ДЕТАЛЬ 3: ЩИТ -->
  <g id="shield-group" filter="url(#dropShadow)">
    <!-- Основа щита -->
    <path d="M 100 200 L 155 185 L 155 270 Q 127 310 100 270 Z" fill="url(#shieldGrad)" stroke="#475569" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Крест -->
    <path d="M 127 190 L 127 295 M 105 235 L 150 235" stroke="#fbbf24" stroke-width="10" />
    <path d="M 127 190 L 127 295 M 105 235 L 150 235" stroke="#fef08a" stroke-width="4" />
    
    <!-- Заклепки -->
    <circle cx="112" cy="210" r="3" fill="#fbbf24" />
    <circle cx="143" cy="202" r="3" fill="#fbbf24" />
    <circle cx="112" cy="260" r="3" fill="#fbbf24" />
    <circle cx="143" cy="252" r="3" fill="#fbbf24" />
  </g>

</svg>
