<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Лохматый клуб — Улучшения</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="upgrades">

  <!-- ШАПКА -->
  <header class="header">
    <div class="header__avatar" id="avatar">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="currentColor" d="
          M20 6
          c-6 0 -10 4 -10 10
          c0 2 0.5 3.5 1.5 5
          c-1.5 1 -2.5 2.5 -3 4
          c-0.5 1.5 0 2.5 1 2.5
          c0.7 0 1.2 -0.4 1.6 -1
          c0.6 1.5 1.8 2.6 3.4 3
          c1 2 3 3.5 5.5 3.5
          s4.5 -1.5 5.5 -3.5
          c1.6 -0.4 2.8 -1.5 3.4 -3
          c0.4 0.6 0.9 1 1.6 1
          c1 0 1.5 -1 1 -2.5
          c-0.5 -1.5 -1.5 -3 -3 -4
          c1 -1.5 1.5 -3 1.5 -5
          c0 -6 -4 -10 -10 -10
          z"
        />
        <circle cx="16" cy="17" r="1.6" fill="#0A0A0A"/>
        <circle cx="24" cy="17" r="1.6" fill="#0A0A0A"/>
      </svg>
    </div>

    <div class="header__info">
      <div class="header__name" id="userName">Гость</div>
      <div class="header__username" id="userUsername">@guest</div>
    </div>

    <div class="header__stats">
      <div class="stat-pill stat-pill--balance">
        <span class="stat-pill__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8l9-5 9 5-9 5-9-5z" fill="currentColor" fill-opacity="0.25"/>
            <path d="M3 8v8l9 5 9-5V8"/>
            <path d="M3 8l9 5 9-5"/>
            <path d="M12 13v8"/>
          </svg>
        </span>
        <span class="stat-pill__value" id="balanceTop">0</span>
      </div>

      <div class="stat-pill stat-pill--rate">
        <span class="stat-pill__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h4l2-6 4 12 2-6h4"/>
          </svg>
        </span>
        <span class="stat-pill__value" id="rateTop">+0</span>
      </div>
    </div>
  </header>

  <!-- ЭКРАН: УЛУЧШЕНИЯ -->
  <main class="page">

    <div class="tabs" role="tablist">
      <button class="tab tab--active" data-tab-target="click" type="button" role="tab">
        За клик
      </button>
      <button class="tab" data-tab-target="passive" type="button" role="tab">
        В секунду
      </button>
    </div>

    <div class="upgrades-list" id="upgradesList"></div>
  </main>

  <!-- НИЖНЕЕ МЕНЮ -->
  <nav class="bottomnav">
    <a class="nav-btn active" href="upgrades.html">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 16V8"/>
          <path d="M8.5 11.5L12 8l3.5 3.5"/>
        </svg>
      </span>
      <span class="nav-label">Улучшения</span>
    </a>

    <a class="nav-btn" href="index.html">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v10"/>
          <path d="M14.5 9.5c0-1-1.1-1.5-2.5-1.5s-2.5.5-2.5 1.5 1.1 1.5 2.5 1.5 2.5.5 2.5 1.5-1.1 1.5-2.5 1.5-2.5-.5-2.5-1.5"/>
        </svg>
      </span>
      <span class="nav-label">Заработок</span>
    </a>

    <a class="nav-btn" href="profile.html">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"/>
          <path d="M4.5 20c1-3.5 4-5.5 7.5-5.5s6.5 2 7.5 5.5"/>
        </svg>
      </span>
      <span class="nav-label">Профиль</span>
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
