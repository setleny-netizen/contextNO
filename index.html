<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Лохматый клуб</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ВЕРХ: счётчик баланса с иконкой кубика -->
  <header class="topbar">
    <div class="balance-card">
      <div class="balance-info">
        <div class="balance-label">Ваш счёт</div>
        <div class="balance-value" id="balance">0</div>
      </div>
      <div class="balance-icon">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="cubeFace" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#EAF6FF"/>
              <stop offset="50%"  stop-color="#BFE3F5"/>
              <stop offset="100%" stop-color="#7FB8D9"/>
            </linearGradient>
            <linearGradient id="cubeTop" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#DCEEF8"/>
            </linearGradient>
            <linearGradient id="cubeSide" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#9CC7E0"/>
              <stop offset="100%" stop-color="#4A7BA3"/>
            </linearGradient>
          </defs>
          <polygon points="20,4 36,12 20,20 4,12" fill="url(#cubeTop)"/>
          <polygon points="4,12 20,20 20,36 4,28" fill="url(#cubeFace)"/>
          <polygon points="36,12 36,28 20,36 20,20" fill="url(#cubeSide)"/>
          <polygon points="20,6 30,11 20,15 10,11" fill="#FFFFFF" opacity="0.6"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- ЦЕНТР: айсберг (SVG) -->
  <main class="stage">
    <div class="iceberg-wrap">
      <svg class="iceberg-svg" id="iceberg" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="iceBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#F2EFE6"/>
            <stop offset="30%"  stop-color="#DCEEF8"/>
            <stop offset="60%"  stop-color="#9CC7E0"/>
            <stop offset="85%"  stop-color="#4A7BA3"/>
            <stop offset="100%" stop-color="#1B2A41"/>
          </linearGradient>

          <linearGradient id="iceShine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="iceShadow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#243B55" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#1B2A41" stop-opacity="0.85"/>
          </linearGradient>

          <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#7FB8D9" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#1B2A41" stop-opacity="0"/>
          </linearGradient>

          <filter id="softBlur">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>

        <!-- ОТРАЖЕНИЕ (не кликабельно) -->
        <g filter="url(#softBlur)" opacity="0.55" pointer-events="none">
          <path d="M 60 320
                   L 100 360 L 200 370 L 300 355 L 340 320
                   L 340 380 L 60 380 Z"
                fill="url(#reflection)"/>
        </g>

        <!-- ОСНОВНОЙ СИЛУЭТ (кликабельный) -->
        <path d="M 60 320
                 L 90 260
                 L 130 200
                 L 170 150
                 L 195 90
                 L 210 60
                 L 225 100
                 L 240 130
                 L 270 150
                 L 300 180
                 L 330 230
                 L 345 280
                 L 340 320
                 L 200 330
                 L 100 325 Z"
              fill="url(#iceBody)"/>

        <!-- ЛЕВАЯ ГРАНЬ — блик -->
        <path d="M 60 320
                 L 90 260
                 L 130 200
                 L 170 150
                 L 195 90
                 L 210 60
                 L 200 130
                 L 175 200
                 L 140 270
                 L 110 320 Z"
              fill="url(#iceShine)" opacity="0.7"/>

        <!-- ПРАВАЯ ГРАНЬ — тень -->
        <path d="M 225 100
                 L 240 130
                 L 270 150
                 L 300 180
                 L 330 230
                 L 345 280
                 L 340 320
                 L 260 325
                 L 250 230
                 L 235 160 Z"
              fill="url(#iceShadow)"/>

        <!-- ВНУТРЕННИЕ ТРЕЩИНЫ -->
        <g stroke="#7FB8D9" stroke-width="1.2" fill="none" opacity="0.55">
          <path d="M 210 60 L 205 130 L 220 180 L 200 250 L 215 320"/>
          <path d="M 175 200 L 200 220 L 240 230"/>
          <path d="M 130 200 L 160 240 L 150 300"/>
          <path d="M 300 180 L 285 240 L 305 300"/>
        </g>

        <!-- БОРОЗДЫ ВНИЗУ -->
        <g stroke="#1B2A41" stroke-width="1" opacity="0.45">
          <line x1="120" y1="270" x2="118" y2="322"/>
          <line x1="150" y1="280" x2="148" y2="324"/>
          <line x1="185" y1="285" x2="183" y2="326"/>
          <line x1="225" y1="290" x2="223" y2="325"/>
          <line x1="260" y1="290" x2="258" y2="323"/>
          <line x1="295" y1="285" x2="293" y2="320"/>
        </g>

        <!-- ЛИНИЯ ВОДЫ (не кликабельно) -->
        <line x1="40" y1="325" x2="360" y2="325"
              stroke="#7FB8D9" stroke-width="1.2" opacity="0.5"
              pointer-events="none"/>

        <!-- ИЗМОРОЗЬ -->
        <g fill="#FFFFFF" opacity="0.9">
          <circle cx="180" cy="140" r="1.2"/>
          <circle cx="205" cy="170" r="1"/>
          <circle cx="230" cy="200" r="1.1"/>
          <circle cx="160" cy="230" r="1"/>
          <circle cx="280" cy="220" r="1.2"/>
          <circle cx="310" cy="260" r="1"/>
        </g>
      </svg>
    </div>

    <!-- Слой летящих кубиков -->
    <div class="cubes-layer" id="cubesLayer"></div>
  </main>

  <!-- НИЗ: под будущие кнопки -->
  <footer class="bottombar" id="bottombar">
    <!-- кнопки добавим позже -->
  </footer>

  <script>
    // ===== MVP-логика клика =====
    const balanceEl = document.getElementById('balance');
    const iceberg   = document.getElementById('iceberg');
    const wrap      = document.querySelector('.iceberg-wrap');
    const layer     = document.getElementById('cubesLayer');

    let balance = 0;
    let lastClick = 0;
    const CLICK_COOLDOWN = 60; // мс

    // Клик ловим на самом SVG — срабатывает только по залитым фигурам
    iceberg.addEventListener('pointerdown', (e) => {
      const now = performance.now();
      if (now - lastClick < CLICK_COOLDOWN) return;
      lastClick = now;

      // 1. Вздрагивание
      wrap.classList.remove('hit');
      void wrap.offsetWidth;
      wrap.classList.add('hit');

      // 2. Трещина в точке клика
      spawnCrack(e.clientX, e.clientY);

      // 3. Кубик, летящий в счётчик
      spawnCube(e.clientX, e.clientY);
    });

    function spawnCrack(x, y) {
      const crack = document.createElement('div');
      crack.className = 'crack';
      crack.style.left = x + 'px';
      crack.style.top  = y + 'px';
      document.body.appendChild(crack);
      setTimeout(() => crack.remove(), 400);
    }

    function spawnCube(startX, startY) {
      const cube = document.createElement('div');
      cube.className = 'cube';
      cube.style.left = startX + 'px';
      cube.style.top  = startY + 'px';

      const target  = balanceEl.getBoundingClientRect();
      const targetX = target.left + target.width  / 2;
      const targetY = target.top  + target.height / 2;

      const dx = targetX - startX;
      const dy = targetY - startY;

      const jitter = (Math.random() - 0.5) * 60;

      cube.style.setProperty('--dx', dx + 'px');
      cube.style.setProperty('--dy', dy + 'px');
      cube.style.setProperty('--jx', jitter + 'px');

      layer.appendChild(cube);

      cube.addEventListener('animationend', () => {
        balance += 1;
        balanceEl.textContent = balance;
        balanceEl.classList.remove('pulse');
        void balanceEl.offsetWidth;
        balanceEl.classList.add('pulse');
        cube.remove();
      });
    }
  </script>
</body>
</html>
