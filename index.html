<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Лохматый клуб — Заработок</title>
  <style>
    /* ============================================================
       CSS: СТИЛИ
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0A0A0A;
      --card:       #141414;
      --card-2:     #1A1A1A;
      --border:     #1F1F1F;
      --gold:       #C9A227;
      --gold-2:     #D4AF37;
      --cream:      #F2EFE6;
      --muted:      #6E6E6E;
      --green:      #4ADE80;
      --nav-height: 72px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ================= ШАПКА ================= */
    .header {
      position: relative;
      z-index: 5;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header__avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #1B2A41 0%, #243B55 100%);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(201,162,39,0.25);
    }
    .header__avatar svg { width: 70%; height: 70%; color: var(--cream); }

    .header__info { flex: 1; min-width: 0; }
    .header__name { font-size: 16px; font-weight: 800; color: var(--cream); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header__username { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .header__stats { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }

    .stat-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--card-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 4px 8px;
      font-size: 12px; font-weight: 700; color: var(--cream);
      line-height: 1; min-width: 80px; justify-content: flex-end;
    }

    .stat-pill__icon { width: 14px; height: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .stat-pill__icon svg { width: 100%; height: 100%; display: block; }
    .stat-pill--balance .stat-pill__icon { color: #BFE3F5; }
    .stat-pill--rate    .stat-pill__icon { color: var(--green); }
    .stat-pill__value { font-variant-numeric: tabular-nums; }
    .stat-pill__value.pulse { animation: pulse 0.3s ease; }

    @keyframes pulse {
      0%   { transform: scale(1);    color: var(--cream); }
      50%  { transform: scale(1.15); color: var(--gold-2); }
      100% { transform: scale(1);    color: var(--cream); }
    }

    /* ================= КОНТЕЙНЕР СТРАНИЦЫ ================= */
    .page {
      position: relative;
      height: calc(100vh - 90px - var(--nav-height));
      padding: 4px 16px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: none;
    }

    .page.active { display: flex; flex-direction: column; }

    /* ================= ЭКРАН: ЗАРАБОТОК ================= */
    .page--earn {
      align-items: center;
      justify-content: center;
      gap: 14px;
      overflow: hidden;
    }

    .iceberg-wrap {
      position: relative;
      width: 300px;
      height: 217px;
      transition: transform 0.08s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }

    .iceberg-svg { width: 100%; height: 100%; display: block; pointer-events: auto; overflow: visible; }
    .iceberg-wrap.hit { animation: hit 0.12s ease; }

    @keyframes hit {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(4px) scale(0.985); }
      100% { transform: translateY(0); }
    }

    /* ---- Анимации снеговика ---- */
    .bob {
      animation: bob 3.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    @keyframes bob {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50%      { transform: scaleY(1.015) translateY(-2px); }
    }
    .sword { transform-box: fill-box; transform-origin: 50% 85%; }
    .sword.swing { animation: swing 0.28s ease-out; }
    @keyframes swing {
      0%   { transform: rotate(0deg); }
      40%  { transform: rotate(-42deg); }
      100% { transform: rotate(0deg); }
    }
    .snowfall { animation: fall 5s linear infinite; }
    .snowfall.s2 { animation-delay: 1.2s; animation-duration: 6s; }
    .snowfall.s3 { animation-delay: 2.4s; animation-duration: 5.5s; }
    .snowfall.s4 { animation-delay: 3.4s; animation-duration: 6.5s; }
    @keyframes fall {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 0.9; }
      100% { transform: translateY(120px); opacity: 0; }
    }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }

    /* ===== Снег / камера / HP ===== */
    #snowGround { transition: transform 0.55s cubic-bezier(.6,.05,.3,1); }

    #snowmanGroup.hit {
      animation: hitShake 0.14s ease;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    @keyframes hitShake {
      0%,100% { transform: translateX(0) scale(1); }
      25%     { transform: translateX(-3px) scale(0.99); }
      60%     { transform: translateX(3px)  scale(1.01); }
    }

    #snowmanGroup.collapse {
      animation: collapse 0.5s ease-in forwards;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    @keyframes collapse {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      60%  { opacity: 0.7; transform: scale(0.85) translateY(8px); }
      100% { opacity: 0; transform: scale(0.4) translateY(30px); }
    }

    #snowmanGroup.spawn {
      animation: spawnIn 0.45s ease-out;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    @keyframes spawnIn {
      0%   { opacity: 0; transform: translateX(60px) scale(0.6); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* Всплывающий урон */
    .dmg-pop {
      position: fixed; pointer-events: none; z-index: 200;
      font-weight: 800; font-size: 16px; color: #FF6B6B;
      text-shadow: 0 0 6px rgba(0,0,0,0.9);
      transform: translate(-50%, -50%);
      animation: dmgPop 0.55s ease-out forwards;
    }
    @keyframes dmgPop {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -140%) scale(0.8); }
    }

    /* Летящий кубик */
    .cubes-layer { position: fixed; inset: 0; pointer-events: none; z-index: 4; }

    .cube {
      position: fixed; width: 22px; height: 22px;
      border-radius: 4px;
      background: linear-gradient(135deg, #EAF6FF 0%, #BFE3F5 40%, #7FB8D9 100%);
      box-shadow: inset 2px 2px 4px rgba(255,255,255,0.9), inset -2px -2px 6px rgba(27,42,65,0.4), 0 0 10px rgba(191,227,245,0.7);
      transform: translate(-50%, -50%);
      animation: flyToBalance 0.7s cubic-bezier(0.5, -0.3, 0.7, 1.2) forwards;
      display: flex; justify-content: center; align-items: center;
      font-size: 12px; font-weight: 800; color: #1B2A41;
      pointer-events: none; z-index: 10;
    }

    @keyframes flyToBalance {
      0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      40% { transform: translate(calc(-50% + var(--dx) * 0.4 + var(--jx)), calc(-50% + var(--dy) * 0.4 - 40px)) scale(1.1) rotate(120deg); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3) rotate(360deg); opacity: 0; }
    }

    /* Ледяные искры */
    .particle {
      position: fixed; width: 6px; height: 6px;
      background-color: #fff; border-radius: 50%; pointer-events: none; z-index: 100;
      box-shadow: 0 0 10px #fff, 0 0 20px #00e5ff, 0 0 30px #2962ff;
      transform: translate(-50%, -50%);
      animation: explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes explode {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(calc(-50% + cos(var(--angle)) * var(--distance)), calc(-50% + sin(var(--angle)) * var(--distance) + 30px)) scale(0.3); opacity: 0; }
    }

    .hintbar { text-align: center; pointer-events: none; }
    .hint-text { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }

    /* ================= ЭКРАН: УЛУЧШЕНИЯ ================= */
    .tabs { display: flex; background: var(--card-2); border-radius: 12px; padding: 4px; margin-bottom: 14px; margin-top: 4px; }
    .tab { flex: 1; padding: 8px 12px; background: transparent; border: none; color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; border-radius: 8px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
    .tab--active { background: var(--card); color: var(--gold-2); box-shadow: 0 0 0 1px var(--border); }

    .upgrades-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }

    .upgrade-card { display: flex; align-items: center; gap: 12px; background: var(--card-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .upgrade-card__icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: linear-gradient(135deg, #EAF6FF 0%, #BFE3F5 50%, #7FB8D9 100%); display: flex; align-items: center; justify-content: center; color: #1B2A41; font-weight: 800; font-size: 14px; }
    .upgrade-card__info { flex: 1; min-width: 0; }
    .upgrade-card__name { font-size: 14px; font-weight: 700; color: var(--cream); margin-bottom: 2px; }
    .upgrade-card__desc { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .upgrade-card__level { font-size: 11px; color: var(--gold-2); opacity: 0.85; }
    .upgrade-card__action { flex-shrink: 0; }

    .buy-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 12px; background: var(--gold); color: #0A0A0A; border: none; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.15s ease, opacity 0.15s ease; min-width: 84px; }
    .buy-btn:hover:not(:disabled) { background: var(--gold-2); }
    .buy-btn:disabled { background: var(--card); color: var(--muted); cursor: not-allowed; border: 1px solid var(--border); }
    .buy-btn__price { font-size: 11px; opacity: 0.9; font-weight: 600; }

    /* ================= ЭКРАН: ПРОФИЛЬ ================= */
    .page--profile { padding-top: 8px; }
    .profile-stats { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
    .stat-card { background: var(--card-2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stat-card__label { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
    .stat-card__value { font-size: 18px; font-weight: 700; color: var(--cream); letter-spacing: -0.01em; }
    .reset-block { margin-top: 6px; }

    .reset-btn { width: 100%; padding: 14px 16px; background: transparent; border: 1px solid #7F1D1D; color: #F87171; border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
    .reset-btn:hover { background: rgba(127, 29, 29, 0.15); border-color: #B91C1C; color: #FCA5A5; }

    /* ================= НИЖНЕЕ МЕНЮ ================= */
    .bottomnav {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
      padding: 8px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; align-items: stretch; justify-content: space-around; z-index: 10;
    }

    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: transparent; border: none; color: var(--muted); font-family: inherit; font-size: 11px;
      letter-spacing: 0.02em; cursor: pointer; padding: 6px 4px; border-radius: 12px; text-decoration: none;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .nav-btn:hover { color: var(--cream); }
    .nav-btn.active { color: var(--gold-2); }
    .nav-btn.active .nav-icon { filter: drop-shadow(0 0 8px rgba(212,175,55,0.45)); }
    .nav-icon { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; transition: filter 0.15s ease; }
    .nav-icon svg { width: 100%; height: 100%; }
    .nav-label { font-size: 11px; line-height: 1; }

    /* ================= МОДАЛКА ================= */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal__backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
    .confirm { position: relative; width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px; transform: scale(0.9); opacity: 0; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .modal.open .confirm { transform: scale(1); opacity: 1; }
    .confirm__title { font-size: 18px; font-weight: 700; color: var(--cream); text-align: center; }
    .confirm__text { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
    .confirm__actions { display: flex; gap: 10px; margin-top: 4px; }
    .confirm__btn { flex: 1; padding: 12px 16px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
    .confirm__btn--ghost { background: transparent; border: 1px solid var(--border); color: var(--cream); }
    .confirm__btn--ghost:hover { border-color: var(--gold-2); color: var(--gold-2); }
    .confirm__btn--danger { background: #B91C1C; border: 1px solid #B91C1C; color: #FFFFFF; }
    .confirm__btn--danger:hover { background: #DC2626; border-color: #DC2626; }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <header class="header">
    <div class="header__avatar" id="avatar">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="currentColor" d="M20 6c-6 0 -10 4 -10 10c0 2 0.5 3.5 1.5 5c-1.5 1 -2.5 2.5 -3 4c-0.5 1.5 0 2.5 1 2.5c0.7 0 1.2 -0.4 1.6 -1c0.6 1.5 1.8 2.6 3.4 3c1 2 3 3.5 5.5 3.5s4.5 -1.5 5.5 -3.5c1.6 -0.4 2.8 -1.5 3.4 -3c0.4 0.6 0.9 1 1.6 1c1 0 1.5 -1 1 -2.5c-0.5 -1.5 -1.5 -3 -3 -4c1 -1.5 1.5 -3 1.5 -5c0 -6 -4 -10 -10 -10z" />
        <circle cx="16" cy="17" r="1.6" fill="#0A0A0A"/>
        <circle cx="24" cy="17" r="1.6" fill="#0A0A0A"/>
      </svg>
    </div>

    <div class="header__info">
      <div class="header__name" id="userName">Гость</div>
      <div class="header__username" id="userUsername">@guest</div>
    </div>

    <div class="header__stats">
      <div class="stat-pill stat-pill--balance">
        <span class="stat-pill__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 8l9-5 9 5-9 5-9-5z" fill="currentColor" fill-opacity="0.25"/>
            <path d="M3 8v8l9 5 9-5V8"/>
            <path d="M3 8l9 5 9-5"/>
            <path d="M12 13v8"/>
          </svg>
        </span>
        <span class="stat-pill__value" id="balanceTop">0</span>
      </div>

      <div class="stat-pill stat-pill--rate">
        <span class="stat-pill__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h4l2-6 4 12 2-6h4"/>
          </svg>
        </span>
        <span class="stat-pill__value" id="rateTop">+0</span>
      </div>
    </div>
  </header>

  <!-- ЭКРАН: ЗАРАБОТОК -->
  <main class="page page--earn active" id="page-earn">
    <div class="iceberg-wrap" id="icebergWrap">
      <svg class="iceberg-svg" id="icebergSvg" viewBox="0 0 400 290" xmlns="http://www.w3.org/2000/svg" aria-label="Боевой снеговик">
        <defs>
          <radialGradient id="snow" cx="35%" cy="30%" r="80%">
            <stop offset="0%"   stop-color="#FFFFFF"/>
            <stop offset="55%"  stop-color="#E4F1FA"/>
            <stop offset="100%" stop-color="#9FC4DF"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#EEF2F6"/>
            <stop offset="45%"  stop-color="#A9B5C2"/>
            <stop offset="100%" stop-color="#5A6675"/>
          </linearGradient>
          <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#8E9AA8"/>
            <stop offset="100%" stop-color="#4A5563"/>
          </linearGradient>
          <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#C8372D"/>
            <stop offset="100%" stop-color="#6E1420"/>
          </linearGradient>
          <linearGradient id="shieldBlue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#3C74C4"/>
            <stop offset="100%" stop-color="#1A3668"/>
          </linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#F5DC7E"/>
            <stop offset="100%" stop-color="#B8921F"/>
          </linearGradient>
          <radialGradient id="sGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#8FD3F2" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#8FD3F2" stop-opacity="0"/>
          </radialGradient>

          <!-- Бесконечный паттерн снега (снежинки на земле) -->
          <pattern id="snowPattern" x="0" y="0" width="80" height="120" patternUnits="userSpaceOnUse">
            <rect width="80" height="120" fill="#0A0A0A"/>
            <circle cx="10" cy="20"  r="2.5" fill="#FFFFFF" opacity="0.85"/>
            <circle cx="45" cy="55"  r="2"   fill="#FFFFFF" opacity="0.7"/>
            <circle cx="70" cy="90"  r="2.6" fill="#FFFFFF" opacity="0.9"/>
            <circle cx="25" cy="100" r="1.8" fill="#FFFFFF" opacity="0.6"/>
            <circle cx="60" cy="15"  r="2.2" fill="#FFFFFF" opacity="0.8"/>
          </pattern>

          <!-- Градиент сугроба -->
          <linearGradient id="driftGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#FFFFFF"/>
            <stop offset="40%"  stop-color="#E4F1FA"/>
            <stop offset="100%" stop-color="#9FC4DF"/>
          </linearGradient>
        </defs>

        <!-- Свечение -->
        <ellipse cx="200" cy="150" rx="185" ry="135" fill="url(#sGlow)" pointer-events="none"/>

        <!-- ===== ЗЕМЛЯ: бесконечные сугробы по всему горизонту ===== -->
        <g id="snowGround" pointer-events="none">
          <!-- Нижний пласт (глубина) -->
          <rect x="-1400" y="252" width="3200" height="120" fill="#9FC4DF" opacity="0.55"/>
          <!-- Волнистая поверхность сугробов, растянутая на весь горизонт -->
          <path d="
            M -1400 252
            Q -1350 232  -1300 246
            Q -1250 258  -1200 244
            Q -1150 228  -1100 246
            Q -1050 260  -1000 244
            Q  -950 228   -900 246
            Q  -850 260   -800 244
            Q  -750 228   -700 246
            Q  -650 260   -600 244
            Q  -550 228   -500 246
            Q  -450 260   -400 244
            Q  -350 228   -300 246
            Q  -250 260   -200 244
            Q  -150 228   -100 246
            Q   -50 260      0 246
            Q    50 228    100 246
            Q   150 260    200 244
            Q   250 228    300 246
            Q   350 260    400 244
            Q   450 228    500 246
            Q   550 260    600 244
            Q   650 228    700 246
            Q   750 260    800 244
            Q   850 228    900 246
            Q   950 260   1000 244
            Q  1050 228   1100 246
            Q  1150 260   1200 244
            Q  1250 228   1300 246
            Q  1350 260   1400 244
            Q  1450 228   1500 246
            Q  1550 260   1600 244
            Q  1650 228   1700 246
            Q  1750 260   1800 244
            L 1800 400
            L -1400 400 Z
          " fill="url(#driftGrad)" opacity="0.97"/>
          <!-- Текстура-снежинки поверх -->
          <rect x="-1400" y="252" width="3200" height="50" fill="url(#snowPattern)" opacity="0.55"/>
          <!-- Блик по верху сугроба -->

  <script>
    /* ============================================================
       JS: ЛОГИКА
       ============================================================ */
    const STORAGE_KEY = 'lohmaty_club_state_v1';

    // ---------- Состояние ----------
    function defaultState() {
      return {
        balance: 0,
        totalEarned: 0,
        totalClicks: 0,
        clickLevels: {},
        passiveLevels: {},
        userName: 'Гость',
        userUsername: '@guest',
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return { ...defaultState(), ...parsed };
      } catch (e) {
        console.warn('Ошибка загрузки, старт с нуля', e);
        return defaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Ошибка сохранения', e);
      }
    }

    const state = loadState();

    // ---------- Улучшения ----------
    const CLICK_UPGRADES = [
      { id: 'pick',    name: 'Крепкая кирка', bonus: 1,   basePrice: 50 },
      { id: 'iceaxe',  name: 'Ледоруб',        bonus: 5,   basePrice: 500 },
      { id: 'crew',    name: 'Бригада',        bonus: 15,  basePrice: 5000 },
      { id: 'drill',   name: 'Бур',            bonus: 50,  basePrice: 50000 },
      { id: 'breaker', name: 'Ледокол',        bonus: 200, basePrice: 500000 },
    ];

    const PASSIVE_UPGRADES = [
      { id: 'fridge',     name: 'Холодильник',     bonus: 1,   basePrice: 100 },
      { id: 'freezer',    name: 'Морозилка',       bonus: 5,   basePrice: 1000 },
      { id: 'glacier',    name: 'Ледник',          bonus: 25,  basePrice: 10000 },
      { id: 'farm',       name: 'Айсберг-ферма',   bonus: 100, basePrice: 100000 },
      { id: 'permafrost', name: 'Вечная мерзлота', bonus: 500, basePrice: 1000000 },
    ];

    // ---------- DOM ----------
    const balanceTopEl = document.getElementById('balanceTop');
    const rateTopEl    = document.getElementById('rateTop');
    const userNameEl   = document.getElementById('userName');
    const userUsernameEl = document.getElementById('userUsername');

    // ---------- Форматирование ----------
    function formatNumber(num) {
      if (num < 1000) return Math.floor(num).toString();
      const units = [
        { value: 1e9, symbol: 'млрд' },
        { value: 1e6, symbol: 'млн' },
        { value: 1e3, symbol: 'тыс' }
      ];
      for (let i = 0; i < units.length; i++) {
        if (num >= units[i].value) {
          let formatted = (num / units[i].value).toFixed(2);
          formatted = parseFloat(formatted).toString().replace('.', ',');
          return formatted + ' ' + units[i].symbol;
        }
      }
      return Math.floor(num).toString();
    }

    // ---------- Бонусы ----------
    function getClickBonus() {
      return 1 + CLICK_UPGRADES.reduce((sum, u) => sum + u.bonus * (state.clickLevels[u.id] || 0), 0);
    }

    function getPassiveBonus() {
      return PASSIVE_UPGRADES.reduce((sum, u) => sum + u.bonus * (state.passiveLevels[u.id] || 0), 0);
    }

    function getUpgradePrice(upgrade, level) {
      return Math.floor(upgrade.basePrice * Math.pow(1.15, level));
    }

    // ---------- UI ----------
    function updateHeaderUI() {
      if (balanceTopEl) balanceTopEl.textContent = formatNumber(state.balance) + ' 🧊';
      if (rateTopEl)    rateTopEl.textContent    = `+${formatNumber(getPassiveBonus())}`;
      if (userNameEl)   userNameEl.textContent   = state.userName;
      if (userUsernameEl) userUsernameEl.textContent = state.userUsername;
    }

    function pulseBalance() {
      if (!balanceTopEl) return;
      balanceTopEl.classList.remove('pulse');
      void balanceTopEl.offsetWidth;
      balanceTopEl.classList.add('pulse');
    }

    // ---------- Пассивный доход ----------
    setInterval(() => {
      const income = getPassiveBonus();
      if (income > 0) {
        state.balance += income;
        state.totalEarned += income;
        updateHeaderUI();
        saveState();
      }
    }, 1000);

    // ---------- Навигация (SPA) ----------
    const navButtons = document.querySelectorAll('.nav-btn');
    const pages = {
      earn: document.getElementById('page-earn'),
      upgrades: document.getElementById('page-upgrades'),
      profile: document.getElementById('page-profile')
    };

    navButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const target = btn.dataset.nav;

        navButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        Object.keys(pages).forEach(key => {
          pages[key].classList.remove('active');
        });
        pages[target].classList.add('active');

        if (target === 'upgrades') renderUpgrades();
        if (target === 'profile') updateProfileUI();
      });
    });

    // ======================== ЭКРАН ЗАРАБОТКА ========================
    const wrap  = document.getElementById('icebergWrap');
    const svg   = document.getElementById('icebergSvg');
    const layer = document.getElementById('cubesLayer');
    const swordEl    = document.getElementById('sword');
    const snowmanEl  = document.getElementById('snowmanGroup');
    const snowGround = document.getElementById('snowGround');
    const hpFill     = document.getElementById('hpFill');
    const hpText     = document.getElementById('hpText');
    const debrisLayer = document.getElementById('debrisLayer');

    // ---------- HP снеговика ----------
    const MAX_HP = 100;
    let hp = MAX_HP;

    function updateHpBar() {
      const pct = Math.max(0, hp) / MAX_HP;
      hpFill.setAttribute('width', (156 * pct).toFixed(1));
      hpText.textContent = `${Math.max(0, Math.ceil(hp))} / ${MAX_HP}`;
    }
    updateHpBar();

    // ---------- Скролл камеры (сдвиг земли) ----------
    let snowOffset = 0;
    function scrollSnowBy(dx) {
      snowOffset += dx;
      snowGround.setAttribute('transform', `translate(${snowOffset} 0)`);
    }

    // ---------- Клик по снеговику ----------
    let lastClick = 0;
    const CLICK_COOLDOWN = 60;
    let dead = false;

    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (dead) return;

      const now = performance.now();
      if (now - lastClick < CLICK_COOLDOWN) return;
      lastClick = now;

      // Анимация
      snowmanEl.classList.remove('hit');
      void snowmanEl.offsetWidth;
      snowmanEl.classList.add('hit');

      swordEl.classList.remove('swing');
      void swordEl.getBoundingClientRect();
      swordEl.classList.add('swing');

      spawnParticles(e.clientX, e.clientY);

      // Урон и награда
      const reward = getClickBonus();
      hp -= reward;
      updateHpBar();
      spawnDmgPop(e.clientX, e.clientY, reward);
      spawnCube(e.clientX, e.clientY, reward);

      state.totalClicks += 1;
      saveState();

      if (hp <= 0) killSnowman();
    });

    // ---------- Смерть снеговика: развал на части ----------
    function killSnowman() {
      dead = true;
      hp = 0;
      updateHpBar();

      snowmanEl.classList.remove('hit');

      // Частицы «развала»
      const rect = svg.getBoundingClientRect();
      const cx = rect.left + rect.width  * 0.5;
      const cy = rect.top  + rect.height * 0.72;
      spawnParticles(cx, cy, 30);

      // Скрываем целого снеговика мгновенно
      snowmanEl.style.transition = 'opacity 0.15s ease';
      snowmanEl.style.opacity = '0';

      // Создаём осколки (в SVG-координатах)
      createDebris();

      setTimeout(() => {
        // Камера едет вправо — земля и развалины уходят влево
        scrollSnowBy(-420);

        // Отъезд развалин влево
        debrisLayer.style.transition = 'transform 0.5s ease-in, opacity 0.5s ease-in';
        debrisLayer.style.transform  = 'translateX(-480px)';
        debrisLayer.style.opacity    = '0';

        setTimeout(() => {
          // Очистка
          debrisLayer.innerHTML = '';
          debrisLayer.style.transition = 'none';
          debrisLayer.style.transform  = 'translateX(0)';
          debrisLayer.style.opacity    = '1';

          // Сброс земли
          snowGround.style.transition = 'none';
          snowGround.setAttribute('transform', 'translate(0 0)');
          snowOffset = 0;
          void snowGround.offsetWidth;
          snowGround.style.transition = '';

          // Новый HP
          hp = MAX_HP;
          updateHpBar();

          // Новый снеговик въезжает справа
          snowmanEl.style.transition = 'none';
          snowmanEl.style.transform  = 'translateX(480px)';
          snowmanEl.style.opacity    = '0';

          requestAnimationFrame(() => {
            snowmanEl.style.transition = 'transform 0.45s ease-out, opacity 0.45s ease-out';
            snowmanEl.style.transform  = 'translateX(0)';
            snowmanEl.style.opacity    = '1';

            setTimeout(() => {
              snowmanEl.style.transition = '';
              dead = false;
            }, 450);
          });
        }, 500);
      }, 220);
    }

    // ---------- Создание осколков (SVG) ----------
    function createDebris() {
      // Собираем все группы, которые будут разлетаться.
      // Части: голова (с лицом/шлемом), морковка, шлем, щит, меч, 3 снежных кома.
      // Идея: клонируем текущий снеговик и разрезаем на части, задавая каждой
      // случайную скорость + вращение + падение вниз.

      // Снежные комы: позиции центров и радиусы
      const parts = [
        // Верхний ком (голова)
        { type: 'circle', cx: 200, cy: 88,  r: 32 },
        // Средний ком
        { type: 'circle', cx: 200, cy: 145, r: 40 },
        // Нижний ком
        { type: 'circle', cx: 200, cy: 212, r: 52 },
      ];

      // Отдельные элементы (клоны)
      const clones = [];

      // Клонируем снежные комы из текущего снеговика
      const snowCircles = snowmanEl.querySelectorAll('.bob > circle');
      // В SVG есть 3 больших круга — клонируем их по одному
      const bodyCircles = Array.from(snowCircles).slice(0, 3);
      bodyCircles.forEach((c) => {
        const clone = c.cloneNode(true);
        clone.setAttribute('fill', 'url(#snow)');
        debrisLayer.appendChild(clone);
        clones.push({ node: clone, type: 'ball' });
      });

      // Клонируем шлем (path + эллипс + плюмаж) — упрощённо: берём group шлема
      // Так как в исходной разметке шлем не в отдельной group, соберём вручную:
      const helmet = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      helmet.innerHTML = `
        <path d="M164 86 Q164 38 200 36 Q236 38 236 86 Z" fill="url(#steel)" stroke="#4A5563" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M200 38 V86" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
        <path d="M176 52 Q180 44 190 41" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="200" cy="86" rx="43" ry="9" fill="url(#steelDark)" stroke="#2F3945" stroke-width="1.5"/>
        <ellipse cx="200" cy="84" rx="43" ry="8" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
        <g fill="url(#gold)">
          <circle cx="170" cy="88" r="1.8"/>
          <circle cx="185" cy="92" r="1.8"/>
          <circle cx="200" cy="93.5" r="1.8"/>
          <circle cx="215" cy="92" r="1.8"/>
          <circle cx="230" cy="88" r="1.8"/>
        </g>
        <path d="M196 40 Q186 12 214 8 Q238 6 246 24 Q228 18 220 32 Q214 20 205 38 Z" fill="url(#cape)" stroke="#5A0F1A" stroke-width="1" stroke-linejoin="round"/>
      `;
      debrisLayer.appendChild(helmet);
      clones.push({ node: helmet, type: 'helmet' });

      // Клонируем морковку (треугольник носа)
      const nose = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      nose.setAttribute('d', 'M195 103 L205 103 L200 118 Z');
      nose.setAttribute('fill', '#F08A24');
      nose.setAttribute('stroke', '#B85E10');
      nose.setAttribute('stroke-width', '1');
      nose.setAttribute('stroke-linejoin', 'round');
      debrisLayer.appendChild(nose);
      clones.push({ node: nose, type: 'nose' });

      // Клонируем щит
      const shield = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      shield.innerHTML = `
        <path d="M98 128 L152 128 L152 168 Q152 196 125 210 Q98 196 98 168 Z" fill="url(#shieldBlue)" stroke="url(#steel)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M125 132 V204 M101 158 H149" stroke="url(#gold)" stroke-width="6" stroke-linecap="butt"/>
        <circle cx="125" cy="158" r="7" fill="url(#gold)" stroke="#8A6A12" stroke-width="1"/>
        <path d="M104 132 L104 160" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
      `;
      debrisLayer.appendChild(shield);
      clones.push({ node: shield, type: 'shield' });

      // Клонируем меч
      const swordClone = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      swordClone.innerHTML = `
        <polygon points="264,124 272,124 271,56 268,44 265,56" fill="url(#steel)" stroke="#4A5563" stroke-width="1" stroke-linejoin="round"/>
        <path d="M268 54 V122" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.4"/>
        <rect x="254" y="122" width="28" height="6" rx="2" fill="url(#gold)" stroke="#8A6A12" stroke-width="1"/>
        <rect x="266" y="128" width="4" height="16" fill="#5B3A22"/>
        <circle cx="268" cy="147" r="4" fill="url(#gold)" stroke="#8A6A12" stroke-width="1"/>
        <circle cx="268" cy="134" r="4.5" fill="#5B3A22"/>
      `;
      debrisLayer.appendChild(swordClone);
      clones.push({ node: swordClone, type: 'sword' });

      // --- Анимация: каждой части — случайное направление и вращение ---
      clones.forEach((item) => {
        // Стартовый центр части
        let startX = 200, startY = 150;
        if (item.type === 'ball') {
          const bbox = item.node.getBBox();
          startX = bbox.x + bbox.width / 2;
          startY = bbox.y + bbox.height / 2;
        } else if (item.type === 'helmet') {
          startX = 200; startY = 60;
        } else if (item.type === 'nose') {
          startX = 200; startY = 110;
        } else if (item.type === 'shield') {
          startX = 125; startY = 168;
        } else if (item.type === 'sword') {
          startX = 268; startY = 100;
        }

        // Случайное направление: влево или вправо
        const dir = Math.random() < 0.5 ? -1 : 1;
        const vx = dir * (60 + Math.random() * 120);
        const vy = -(60 + Math.random() * 140); // вверх-в стороны
        const gravity = 420;
        const rotSpeed = (Math.random() - 0.5) * 900;
        const startRot = 0;

        const t0 = performance.now();
        const duration = 900; // мс
        let curX = startX, curY = startY, curRot = startRot;

        function step(now) {
          const t = Math.min(1, (now - t0) / duration);
          // Физика (упрощённая): x = x0 + vx*t, y = y0 + vy*t + 0.5*g*t^2
          const x = startX + vx * t;
          const y = startY + vy * t + 0.5 * gravity * t * t;
          const rot = startRot + rotSpeed * t;

          // Сдвиг относительно исходного положения части
          const dx = x - startX;
          const dy = y - startY;

          item.node.setAttribute('transform', `translate(${dx} ${dy}) rotate(${rot} ${startX} ${startY})`);

          if (t < 1) {
            requestAnimationFrame(step);
          }
        }
        requestAnimationFrame(step);
      });
    }

    // ---------- Всплывающий урон ----------
    function spawnDmgPop(x, y, amount) {
      const el = document.createElement('div');
      el.className = 'dmg-pop';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      el.textContent = '-' + formatNumber(amount);
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    // ---------- Искры ----------
    function spawnParticles(x, y, count = 18) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top  = y + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist  = 50 + Math.random() * 80;
        p.style.setProperty('--angle', `${angle}rad`);
        p.style.setProperty('--distance', `${dist}px`);
        const size = 6 + Math.random() * 8;
        p.style.width  = `${size}px`;
        p.style.height = `${size}px`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    // ---------- Летящий кубик на баланс ----------
    function spawnCube(startX, startY, reward) {
      const cube = document.createElement('div');
      cube.className = 'cube';
      cube.style.left = startX + 'px';
      cube.style.top  = startY + 'px';
      cube.textContent = '+';
      const target  = balanceTopEl.getBoundingClientRect();
      const targetX = target.left + target.width  / 2;
      const targetY = target.top  + target.height / 2;
      const dx = targetX - startX;
      const dy = targetY - startY;
      const jitter = (Math.random() - 0.5) * 60;
      cube.style.setProperty('--dx', dx + 'px');
      cube.style.setProperty('--dy', dy + 'px');
      cube.style.setProperty('--jx', jitter + 'px');
      layer.appendChild(cube);
      cube.addEventListener('animationend', () => {
        state.balance     += reward;
        state.totalEarned += reward;
        updateHeaderUI();
        pulseBalance();
        saveState();
        cube.remove();
      });
    }

    // ======================== УЛУЧШЕНИЯ ========================
    const upgradesList = document.getElementById('upgradesList');
    const tabs = document.querySelectorAll('.tab');
    let activeUpgradeTab = 'click';

    function renderUpgrades() {
      if (!upgradesList) return;
      const list   = activeUpgradeTab === 'click' ? CLICK_UPGRADES : PASSIVE_UPGRADES;
      const levels = activeUpgradeTab === 'click' ? state.clickLevels : state.passiveLevels;
      const suffix = activeUpgradeTab === 'click' ? 'к клику' : 'в секунду';

      upgradesList.innerHTML = '';

      list.forEach((upgrade) => {
        const level  = levels[upgrade.id] || 0;
        const price  = getUpgradePrice(upgrade, level);
        const canBuy = state.balance >= price;

        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `
          <div class="upgrade-card__icon">+${upgrade.bonus}</div>
          <div class="upgrade-card__info">
            <div class="upgrade-card__name">${upgrade.name}</div>
            <div class="upgrade-card__desc">+${upgrade.bonus} ${suffix}</div>
            <div class="upgrade-card__level">Уровень: ${level}</div>
          </div>
          <div class="upgrade-card__action">
            <button class="buy-btn" type="button" data-buy="${upgrade.id}" ${canBuy ? '' : 'disabled'}>
              Купить
              <span class="buy-btn__price">${formatNumber(price)}</span>
            </button>
          </div>
        `;
        upgradesList.appendChild(card);
      });
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('tab--active'));
        tab.classList.add('tab--active');
        activeUpgradeTab = tab.dataset.tabTarget;
        renderUpgrades();
      });
    });

    upgradesList.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-buy]');
      if (!btn || btn.disabled) return;

      const id      = btn.dataset.buy;
      const list    = activeUpgradeTab === 'click' ? CLICK_UPGRADES : PASSIVE_UPGRADES;
      const levels  = activeUpgradeTab === 'click' ? state.clickLevels : state.passiveLevels;
      const upgrade = list.find((u) => u.id === id);
      if (!upgrade) return;

      const level = levels[id] || 0;
      const price = getUpgradePrice(upgrade, level);

      if (state.balance < price) return;

      state.balance -= price;
      levels[id] = level + 1;

      updateHeaderUI();
      saveState();
      renderUpgrades();
    });

    // ======================== ПРОФИЛЬ ========================
    function updateProfileUI() {
      document.getElementById('statTotalEarned').textContent = formatNumber(state.totalEarned);
      document.getElementById('statClicks').textContent      = formatNumber(state.totalClicks);
      document.getElementById('statBalance').textContent     = formatNumber(state.balance);
      document.getElementById('statRate').textContent        = formatNumber(getPassiveBonus());
      document.getElementById('statClickBonus').textContent  = formatNumber(getClickBonus());
    }

    const confirmModal    = document.getElementById('confirmModal');
    const resetStartBtn   = document.getElementById('resetStartBtn');
    const resetConfirmBtn = document.getElementById('resetConfirmBtn');

    function openModal(modal) { modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); }
    function closeModal(modal) { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }

    confirmModal.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) closeModal(confirmModal);
    });

    resetStartBtn.addEventListener('click', () => {
      openModal(confirmModal);
    });

    resetConfirmBtn.addEventListener('click', () => {
      const fresh = defaultState();
      Object.keys(state).forEach((k) => delete state[k]);
      Object.assign(state, fresh);
      localStorage.removeItem(STORAGE_KEY);
      updateHeaderUI();
      updateProfileUI();
      closeModal(confirmModal);
    });

    // ---------- Инициализация ----------
    updateHeaderUI();
    renderUpgrades();
  </script>
</body>
</html>
